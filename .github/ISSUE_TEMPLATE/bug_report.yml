name: Bug report
description: Report a reproducible failure in the pipeline
labels: [bug]
body:
  - type: dropdown
    id: how-run
    attributes:
      label: How did you run the pipeline?
      options:
        - Container via ./docker-overnight.sh
        - Host-native via ./run_all.sh
        - Host-native via ./run_power_curve_fitting.sh
        - Per-pipeline Rscript R/<pipeline>/run_pipeline.R
        - Other (please describe in "How to reproduce")
    validations:
      required: true

  - type: input
    id: r-version
    attributes:
      label: R version (host-native runs only)
      description: Output of `R --version | head -1` — leave blank if you ran in the container
    validations:
      required: false

  - type: input
    id: docker-version
    attributes:
      label: Docker version (containerised runs only)
      description: Output of `docker --version` — leave blank if host-native
    validations:
      required: false

  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: What did you expect? What happened?
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      description: Minimal command sequence that triggers the bug
      render: bash
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: |
        Attach the most recent run's log directory:
        - Host-native: `Datalink/Run_Output_Logs/run_all/latest/00_run.log` (and the failing stage's `<stage>.log`)
        - Container: `logs/docker-overnight/latest/03_run.log` (or `01_build.log` / `02_smoke.log` if the failure was during build/smoke)
      render: shell

  - type: checkboxes
    id: checklist
    attributes:
      label: Pre-flight
      options:
        - label: I've verified this reproduces on the current `main` branch
        - label: I've searched existing issues
