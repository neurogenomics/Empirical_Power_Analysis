name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ----------------------------------------------------------------------------
  #  Lint R code
  # ----------------------------------------------------------------------------
  lint-r:
    name: Lint R code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5.1'

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: lintr, styler

      - name: Run lintr
        run: |
          Rscript -e 'lintr::lint_dir("R", linters = lintr::linters_with_defaults(
            object_name_linter = NULL,
            line_length_linter = lintr::line_length_linter(120L)
          ))'

  # ----------------------------------------------------------------------------
  #  Lint Nextflow code
  # ----------------------------------------------------------------------------
  lint-nextflow:
    name: Lint Nextflow
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Nextflow
        uses: nf-core/setup-nextflow@v2
        with:
          version: 'latest-stable'

      - name: Check nextflow.config syntax
        run: nextflow config -show-profiles

      - name: Stub-run to validate workflow wiring
        run: nextflow run main.nf -profile test -stub-run

  # ----------------------------------------------------------------------------
  #  Unit tests per pipeline — parallel matrix, one job per pipeline directory
  # ----------------------------------------------------------------------------
  unit-tests:
    name: R unit tests (${{ matrix.pipeline }})
    runs-on: ubuntu-latest
    container:
      image: bioconductor/bioconductor_docker:RELEASE_3_21
    strategy:
      fail-fast: false
      matrix:
        pipeline:
          - bulk_deg_processing
          - cartesian_downsampling
          - de_diagnostics
          - depth_equalization
          - eda_roussos
          - full_ground_truth
          - power_curve_fitting
          - sharding
    steps:
      - uses: actions/checkout@v4

      - name: Cache R library
        uses: actions/cache@v4
        with:
          # Cache the R site library so testthat/dplyr/qs don't reinstall every run.
          path: /usr/local/lib/R/site-library
          key: ${{ runner.os }}-R-unit-tests-v4-testthat-dplyr-qs
          restore-keys: |
            ${{ runner.os }}-R-unit-tests-v4-

      - name: Install minimal test deps (P3M binary, CRAN source fallback)
        run: |
          # Bioconductor base image already has SingleCellExperiment, Matrix, BiocParallel,
          # SummarizedExperiment, S4Vectors, DESeq2, apeglm, ggplot2.
          # Tests only additionally need testthat, dplyr, qs.
          # Try P3M (pre-compiled binaries) first, then fall back to CRAN source compile
          # (needed because P3M noble+R4.5 sometimes lacks newest qs builds).
          R -e "
            options(
              repos = c(
                P3M = 'https://packagemanager.posit.co/cran/__linux__/noble/latest',
                CRAN = 'https://cloud.r-project.org'
              ),
              HTTPUserAgent = sprintf('R/%s R (%s) %s %s',
                getRversion(), paste(getRversion(), R.version\$status),
                R.version\$platform, R.version\$arch)
            );
            needed <- c('testthat', 'dplyr', 'qs');
            missing <- needed[!needed %in% rownames(installed.packages())];
            if (length(missing)) {
              tryCatch(install.packages(missing, Ncpus = 2),
                       error = function(e) {
                         cat('P3M failed, retrying from CRAN source:', conditionMessage(e), '\n');
                         install.packages(missing, repos = 'https://cloud.r-project.org',
                                          type = 'source', Ncpus = 2)
                       })
            }
            invisible(lapply(needed, function(p) stopifnot(requireNamespace(p, quietly = TRUE))))
          "

      - name: Run testthat for ${{ matrix.pipeline }}
        run: |
          # --no-init-file bypasses the repo's .Rprofile (renv activation) so
          # the system library with testthat remains visible.
          test_dir="R/${{ matrix.pipeline }}/tests"
          if [ -d "$test_dir" ]; then
            echo "=== Running tests in: $test_dir ==="
            R --no-init-file -e "testthat::test_dir('$test_dir', reporter = 'summary', stop_on_failure = TRUE)"
          else
            echo "No test directory for ${{ matrix.pipeline }}, skipping."
          fi

  # ----------------------------------------------------------------------------
  #  End-to-end test: stub pipeline on toy data
  # ----------------------------------------------------------------------------
  integration-test:
    name: Nextflow integration test (stub)
    runs-on: ubuntu-latest
    needs: [lint-nextflow]
    steps:
      - uses: actions/checkout@v4

      - uses: nf-core/setup-nextflow@v2
        with:
          version: 'latest-stable'

      - name: Run pipeline in stub mode
        run: nextflow run main.nf -profile test -stub-run

      - name: Upload execution report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nextflow-execution-report
          path: test_output/pipeline_info/

  # ----------------------------------------------------------------------------
  #  Determinism check — run toy pipeline twice, compare outputs
  # ----------------------------------------------------------------------------
  determinism-check:
    name: Determinism check
    runs-on: ubuntu-latest
    needs: [integration-test]
    steps:
      - uses: actions/checkout@v4

      - uses: nf-core/setup-nextflow@v2
        with:
          version: 'latest-stable'

      - name: First run
        run: nextflow run main.nf -profile test -stub-run --outdir out_a

      - name: Second run
        run: nextflow run main.nf -profile test -stub-run --outdir out_b

      - name: Compare outputs
        run: |
          # Compare all file hashes between the two runs. Any difference on
          # non-timestamped outputs is a determinism regression.
          diff <(find out_a -type f ! -path '*/pipeline_info/*' -exec md5sum {} \; | awk '{print $1,$2}' | sed 's|out_a/||' | sort) \
               <(find out_b -type f ! -path '*/pipeline_info/*' -exec md5sum {} \; | awk '{print $1,$2}' | sed 's|out_b/||' | sort) \
            || (echo "::error::Determinism check failed — outputs differ between runs"; exit 1)
