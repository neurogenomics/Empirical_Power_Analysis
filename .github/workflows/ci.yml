name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ----------------------------------------------------------------------------
  #  Lint R code
  # ----------------------------------------------------------------------------
  lint-r:
    name: Lint R code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5.1'

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: lintr, styler

      - name: Run lintr
        run: |
          Rscript -e 'lintr::lint_dir("R", linters = lintr::linters_with_defaults(
            object_name_linter = NULL,
            line_length_linter = lintr::line_length_linter(120L)
          ))'

  # ----------------------------------------------------------------------------
  #  Lint Nextflow code
  # ----------------------------------------------------------------------------
  lint-nextflow:
    name: Lint Nextflow
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Nextflow
        uses: nf-core/setup-nextflow@v2
        with:
          version: 'latest-stable'

      - name: Check nextflow.config syntax
        run: nextflow config -show-profiles

      - name: Stub-run to validate workflow wiring
        run: nextflow run main.nf -profile test -stub-run

  # ----------------------------------------------------------------------------
  #  Unit tests — all pipelines in a single R session, parallelised via testthat
  # ----------------------------------------------------------------------------
  #  Consolidated from an 8-job matrix to a single job. Matrix paid ~1-2 min
  #  per job in startup overhead (container pull + checkout + cache restore +
  #  install), so 8 jobs burned ~10-15 min of wall-clock before any test ran.
  #  One job pulls the image + installs deps once and then runs all tests.
  # ----------------------------------------------------------------------------
  unit-tests:
    name: R unit tests
    runs-on: ubuntu-latest
    container:
      image: bioconductor/bioconductor_docker:RELEASE_3_21
    steps:
      - uses: actions/checkout@v4

      - name: Cache R library
        uses: actions/cache@v4
        with:
          # Cache the R site library so testthat/qs/dplyr don't reinstall every run.
          path: /usr/local/lib/R/site-library
          key: ${{ runner.os }}-R-unit-tests-v6-testthat-qs-dplyr
          restore-keys: |
            ${{ runner.os }}-R-unit-tests-v6-

      - name: Install minimal test deps (P3M binary only, fail fast)
        run: |
          # Bioconductor base image already has DESeq2, Matrix, BiocParallel,
          # SummarizedExperiment, S4Vectors, SingleCellExperiment, apeglm, ggplot2.
          # Tests grep shows they additionally need testthat, qs, dplyr.
          # P3M binary-only (no source compile fallback) keeps install to seconds.
          R -e "
            options(
              repos = c(P3M = 'https://packagemanager.posit.co/cran/__linux__/noble/latest'),
              HTTPUserAgent = sprintf('R/%s R (%s) %s %s',
                getRversion(), paste(getRversion(), R.version\$status),
                R.version\$platform, R.version\$arch)
            );
            needed <- c('testthat', 'qs', 'dplyr');
            missing <- needed[!needed %in% rownames(installed.packages())];
            if (length(missing)) install.packages(missing, Ncpus = 2, type = 'binary');
            invisible(lapply(needed, function(p) stopifnot(requireNamespace(p, quietly = TRUE))))
          "

      - name: Run all pipeline tests in a single R session
        run: |
          # One R invocation loops over every R/<pipeline>/tests directory,
          # keeping loaded namespaces hot across pipelines. --no-init-file
          # bypasses the repo's .Rprofile (renv activation) so the system
          # library with testthat remains visible.
          R --no-init-file -e "
            pipelines <- list.dirs('R', recursive = FALSE);
            any_failed <- FALSE;
            for (p in pipelines) {
              tdir <- file.path(p, 'tests');
              if (!dir.exists(tdir)) next;
              cat(sprintf('\n=== %s ===\n', tdir));
              res <- tryCatch(
                testthat::test_dir(tdir, reporter = 'summary', stop_on_failure = FALSE),
                error = function(e) { message('ERROR in ', tdir, ': ', conditionMessage(e)); NULL }
              );
              if (is.null(res)) { any_failed <- TRUE; next; }
              df <- as.data.frame(res);
              if (any(df\$failed > 0) || any(df\$error)) any_failed <- TRUE;
            }
            if (any_failed) quit(status = 1);
          "

  # ----------------------------------------------------------------------------
  #  End-to-end test: stub pipeline on toy data
  # ----------------------------------------------------------------------------
  integration-test:
    name: Nextflow integration test (stub)
    runs-on: ubuntu-latest
    needs: [lint-nextflow]
    steps:
      - uses: actions/checkout@v4

      - uses: nf-core/setup-nextflow@v2
        with:
          version: 'latest-stable'

      - name: Run pipeline in stub mode
        run: nextflow run main.nf -profile test -stub-run

      - name: Upload execution report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nextflow-execution-report
          path: test_output/pipeline_info/

  # ----------------------------------------------------------------------------
  #  Determinism check — run toy pipeline twice, compare outputs
  # ----------------------------------------------------------------------------
  determinism-check:
    name: Determinism check
    runs-on: ubuntu-latest
    needs: [integration-test]
    steps:
      - uses: actions/checkout@v4

      - uses: nf-core/setup-nextflow@v2
        with:
          version: 'latest-stable'

      - name: First run
        run: nextflow run main.nf -profile test -stub-run --outdir out_a

      - name: Second run
        run: nextflow run main.nf -profile test -stub-run --outdir out_b

      - name: Compare outputs
        run: |
          # Compare all file hashes between the two runs. Any difference on
          # non-timestamped outputs is a determinism regression.
          diff <(find out_a -type f ! -path '*/pipeline_info/*' -exec md5sum {} \; | awk '{print $1,$2}' | sed 's|out_a/||' | sort) \
               <(find out_b -type f ! -path '*/pipeline_info/*' -exec md5sum {} \; | awk '{print $1,$2}' | sed 's|out_b/||' | sort) \
            || (echo "::error::Determinism check failed — outputs differ between runs"; exit 1)
