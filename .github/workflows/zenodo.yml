name: Zenodo DOI on release

# Zenodo GitHub-integration mints a DOI automatically when a release is published
# — provided the repo has been enabled in Zenodo. This workflow is a reminder +
# release-notes generator, not an API call.

on:
  release:
    types: [published]

jobs:
  announce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify CITATION.cff is up to date
        run: |
          if ! grep -q "^version: \"${{ github.event.release.tag_name }}" CITATION.cff; then
            echo "::warning::CITATION.cff version does not match release tag ${{ github.event.release.tag_name }}"
            echo "::warning::Update CITATION.cff before publishing the release, then re-run Zenodo mint."
          fi

      - name: Post-release reminder
        run: |
          echo "::notice::Release published. Zenodo should auto-mint a DOI within ~5 minutes."
          echo "::notice::Update the DOI in CITATION.cff and nextflow.config manifest once available."
          echo "::notice::Ensure Datalink/ figure data is separately archived on figshare/Zenodo."
