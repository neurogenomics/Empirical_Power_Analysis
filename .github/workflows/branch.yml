name: nf-core branch protection
# Enforces the nf-core convention that PRs to main/master must come from the
# dev branch (or a patch branch).  PRs from feature branches should target dev.

on:
  pull_request_target:
    branches:
      - main
      - master

permissions: {}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check PRs
        if: github.repository == 'neurogenomics/Empirical_Power_Analysis'
        run: |
          { [[ ${{ github.event.pull_request.head.repo.full_name }} == neurogenomics/Empirical_Power_Analysis ]] \
            && [[ $GITHUB_HEAD_REF == "dev" ]]; } \
            || [[ $GITHUB_HEAD_REF == patch* ]]

      - name: Post PR comment on failure
        if: failure()
        uses: mshick/add-pr-comment@b8f338c590a895d50bcbfa6c5859251edc8952fc # v2
        with:
          message: |
            ## This PR is against the `${{ github.event.pull_request.base.ref }}` branch :x:

            * Do not close this PR
            * Click _Edit_ and change the `base` to `dev`
            * This CI test will remain failed until you push a new commit

            ---

            Hi @${{ github.event.pull_request.user.login }},

            PRs to `${{ github.event.pull_request.base.ref }}` should come from
            the `dev` branch (or a `patch/*` branch for hotfixes).
            Please update the base branch of this PR to `dev`.

            Thanks!
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          allow-repeats: false
